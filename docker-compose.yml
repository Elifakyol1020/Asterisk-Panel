name: asterisk
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/10-platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  backend:
    image: asterisk-backend:latest
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-3000},${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    image: asterisk-frontend:latest
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
configs:
  pgadmin_servers:
    content: |
      {"Servers":{"1":{"Name":"Asterisk PostgreSQL","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"${DB_NAME}","Username":"${DB_USERNAME}","SSLMode":"prefer"}}}
volumes:
  pgadmin_data:
  postgres_data:
    name: asterisk-local_postgres_data
