[general]
static=yes
writeprotect=no


[default]
include => tenant-router

[tenant-router]
; TENANT_ID is set on every provisioned endpoint/trunk. Prefixing the dialed
; extension prevents two tenants that both use 1001 from sharing a route.
exten => _X!,1,Goto(realtime,tenant${TENANT_ID}_${EXTEN},1)
exten => s,1,Goto(realtime,tenant${TENANT_ID}_s,1)

[realtime]
switch => Realtime/@extensions
